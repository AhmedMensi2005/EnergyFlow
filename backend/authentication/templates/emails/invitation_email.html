<!DOCTYPE html>

<html>

<head>

<meta charset="utf-8">

</head>

<body style="font-family:Arial;background:#f8fafc;padding:40px;">

<div style="

max-width:600px;

margin:auto;

background:white;

padding:40px;

border-radius:16px;

box-shadow:0 10px 30px rgba(0,0,0,.08);

">

<h2>Welcome to EnergyFlow 👋</h2>

<p>

You have been invited to join EnergyFlow as

<b>{{ role }}</b>.

</p>

<p>

To activate your account, you'll need to choose

your username and password.

</p>

<p style="text-align:center;margin:40px 0;">

<a

href="{{ link }}"

style="

background:#10b981;

padding:14px 28px;

border-radius:10px;

text-decoration:none;

color:white;

font-weight:bold;

display:inline-block;

"

>

Create my account

</a>

</p>

<p>

If you weren't expecting this invitation,

you can safely ignore this email.

</p>

</div>

</body>

</html>
